syntax = "proto3";

option go_package = "chitchat/grpc;proto";

package chitchat;

service ChitChat {
	rpc Join(JoinRequest) returns (stream ChatMessage); // Serverside straming
	rpc Publish(PublishRequest) returns (Answer);
	rpc Disconnect(DisconnectRequest) returns (Answer);
}

message JoinRequest {
	string name = 1; // client id
	int64 lamport = 2; // lamport timestamp for sender
}

message PublishRequest {
	string name = 1;
	string text = 2;
	int64 lamport = 3;
}

message DisconnectRequest {
	string name = 1;
	int64 lamport = 2;
}

message ChatMessage {
        string sender = 1; // the "name"
	string text = 2;
        int64 lamport = 3;
}

message Answer {
  int64 lamport = 1;
}
